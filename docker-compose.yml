services:
  bot:
    build: .
    # Change to ["python", "main.py", "--live"] only after the paper -> promote
    # pipeline in README.md, and set LIVE_TRADING_CONFIRM=YES in .env.
    command: ["python", "main.py", "--paper"]
    restart: unless-stopped
    stop_grace_period: 40s      # time to flatten/flush on shutdown
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  token:
    build: .
    command: ["python", "token_service.py", "serve"]
    restart: unless-stopped
    env_file: .env
    environment:
      TOKEN_SERVICE_HOST: "0.0.0.0"
    volumes:
      - ./data:/app/data

  caddy:                      # automatic HTTPS for the Kite redirect URL
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BOT_DOMAIN: ${BOT_DOMAIN}
      REPORT_TOKEN: ${REPORT_TOKEN:?set REPORT_TOKEN in .env (long random string; the report page path)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/site:/srv/site:ro       # trading report page written by the bot (report_site.py)
      - caddy_data:/data
    depends_on:
      - token

volumes:
  caddy_data:
