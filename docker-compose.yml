services:
  bot:
    build: .
    # SENSEX PRO. Mode from data/mode.json (Telegram /mode live + /confirm); PAPER by default. LIVE also needs
    # LIVE_TRADING_CONFIRM=YES in .env. Never change this to --live by hand.
    command: ["python", "main.py", "--auto"]
    restart: unless-stopped
    stop_grace_period: 40s      # time to journal state on shutdown (an open position is recovered on restart)
    env_file: .env
    ports:
      - "127.0.0.1:8090:8090"   # read-only status dashboard, host loopback only (SSH tunnel to view)
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3

  token:
    build: .
    command: ["python", "token_service.py", "serve"]
    restart: unless-stopped
    env_file: .env
    environment:
      TOKEN_SERVICE_HOST: "0.0.0.0"
    volumes:
      - ./data:/app/data

  caddy:                      # automatic HTTPS for the Kite redirect URL
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BOT_DOMAIN: ${BOT_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - token

volumes:
  caddy_data:
